[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "menumatch"
version = "0.1.0"
description = "Add-on menu item recommender with offline and simulated online evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "duckdb>=1.0",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "moto[s3,server]>=5.0"]

[tool.setuptools.packages.find]
include = ["menumatch*"]

[tool.setuptools.package-data]
menumatch = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
